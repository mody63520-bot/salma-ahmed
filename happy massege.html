<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise for Salma Ahmed</title>
    <link rel="stylesheet" href="happy massege.css">
</head>
<body>

    <div class="container">
        <div id="ui-box">
            <h1>Countdown for Salma Ahmed</h1>
            <div id="countdown">
                <div class="time-box">
                    <span id="days">00</span>
                    <div class="label">Days</div>
                </div>
                <div class="time-box">
                    <span id="hours">00</span>
                    <div class="label">Hours</div>
                </div>
                <div class="time-box">
                    <span id="minutes">00</span>
                    <div class="label">Mins</div>
                </div>
                <div class="time-box">
                    <span id="seconds">00</span>
                    <div class="label">Secs</div>
                </div>
            </div>
        </div>

        <div id="message">
            💖 Happy Message Sent Successfully! 💖<br>
            <span style="font-size: 1.2rem; display: block; margin-top: 10px;">Best wishes to Salma!</span>
        </div>
    </div>

    <script src="happy massege.js"></script>
</body>
</html>
