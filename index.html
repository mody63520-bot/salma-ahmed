<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wait for the Magic</title>
    <link rel="stylesheet" href="happy massege.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="stars-overlay"></div>

    <div class="container">
        <h1 class="wait-title">Wait for the Surprise...Salma✨</h1>
        
        <div id="countdown">
            <div class="time-unit">
                <span id="days">00</span>
                <p>Days</p>
            </div>
            <div class="time-unit">
                <span id="hours">00</span>
                <p>Hours</p>
            </div>
            <div class="time-unit">
                <span id="minutes">00</span>
                <p>Mins</p>
            </div>
            <div class="time-unit">
                <span id="seconds">00</span>
                <p>Secs</p>
            </div>
        </div>

        <div id="message" class="hidden">
            <h2 class="ready-text">The Magic is Ready! 💖</h2>
            <p class="refresh-hint">Refresh the page to unlock your gift!</p>
        </div>
    </div>

    <script src="happy massege.js"></script>
</body>
</html>
